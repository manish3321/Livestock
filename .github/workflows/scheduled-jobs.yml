# Hourly checks (service windows closing, CRITICAL escalation) for hosts without Nest ScheduleModule.
# The nightly job runs from Vercel Cron (see scripts/vercel-output.mjs); "Run workflow" here can also start it by hand.
# Secrets: API_BASE_URL, NOTIFICATION_CRON_SECRET. Variable: ENABLE_NOTIFICATION_CRON=true
name: Scheduled jobs

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [hourly, nightly]
        default: hourly

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_NOTIFICATION_CRON == 'true' }}
    steps:
      - name: Call /v1/jobs
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
          JOB: ${{ inputs.job || 'hourly' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${NOTIFICATION_CRON_SECRET:-}" ]; then
            echo "Missing API_BASE_URL or NOTIFICATION_CRON_SECRET secrets"
            exit 1
          fi
          curl -fsS -X POST "${API_BASE_URL%/}/v1/jobs/${JOB}" \
            -H "x-cron-secret: ${NOTIFICATION_CRON_SECRET}"
